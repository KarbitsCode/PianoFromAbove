name: PianoFromAbove build
on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/**
      - .gitignore
      - README.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up build tools
        shell: pwsh
        run: |
          choco upgrade directx-sdk nsis.portable -y
          $dxsdk = [Environment]::GetEnvironmentVariable("DXSDK_DIR","Machine")
          echo "DXSDK_DIR=$dxsdk" >> $env:GITHUB_ENV
          $atlToolset = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue
            | ForEach-Object { $_.FullName -replace '.*\\MSVC\\([\d.]+)\\.*', '$1' }
            | Sort-Object { [version]$_ } -Descending
            | Select-Object -First 1
          if (-not $atlToolset) { throw "No installed MSVC toolset has the ATL component." }
          Write-Host "Using toolset with ATL: $atlToolset"
          $propsPath = "ThirdVendor\ShellExecAsUser\sources\Directory.Build.props"
          $propsContent = "<Project>`n  <PropertyGroup>`n    <VCToolsVersion>$atlToolset</VCToolsVersion>`n  </PropertyGroup>`n</Project>`n"
          Set-Content -Path $propsPath -Value $propsContent -Encoding UTF8
          Write-Host "Wrote $propsPath"

      - name: Refresh environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: Verify build environment
        shell: pwsh
        run: |
          where.exe cl makensis
          "cl","makensis" | ForEach-Object { Get-Command $_ -ErrorAction Stop }
          cl
          makensis /VERSION

      - name: Build executable
        shell: pwsh
        working-directory: ./
        run: |
          cmd.exe /c "ci.bat"

      - name: Compare artifact build
        uses: KarbitsCode/artifact-comparer@43db522959d21d1bad41a884670eaa59035878fd
        with:
          artifact-name: windows-build
          path: Dist/
          artifact-subpath: Dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-build
          compression-level: 9
          path: |
            Debug/
            Release/
            Dist/

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_KEY }}
          files: |
            ./Debug/*.exe
            ./Release/*.exe
            ./Dist/*
