name: PianoFromAbove build
on:
  push:
    branches:
      - master
    paths-ignore:
      - .github/**
      - .gitignore
      - README.md
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up build tools
        shell: pwsh
        run: |
          choco upgrade directx-sdk nsis.portable -y
          choco upgrade visualstudio2022-workload-vctools -y --package-parameters --includeOptional
          $dxsdk = [Environment]::GetEnvironmentVariable("DXSDK_DIR","Machine")
          echo "DXSDK_DIR=$dxsdk" >> $env:GITHUB_ENV

      - name: Refresh environment
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64
          vsversion: 2022

      - name: Verify build environment
        shell: pwsh
        run: |
          where.exe cl makensis
          "cl","makensis" | ForEach-Object { Get-Command $_ -ErrorAction Stop }
          cl
          makensis /VERSION

      - name: Build executable
        shell: pwsh
        working-directory: ./
        run: |
          cmd.exe /c "ci.bat"
          Copy-Item Release\*.exe Dist -Verbose

      - name: Compare artifact build
        uses: KarbitsCode/artifact-comparer@43db522959d21d1bad41a884670eaa59035878fd
        with:
          artifact-name: windows-build
          path: Dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-build
          compression-level: 9
          path: |
            Dist/

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_KEY }}
          files: |
            ./Dist/*

      - name: Get previous release
        id: previous
        shell: pwsh
        run: |
          $tag = gh api "repos/${{ github.repository }}/git/ref/tags/continuous" --jq '.object.sha'
          if ($LASTEXITCODE -eq 0) {
            "sha=$tag" >> $env:GITHUB_OUTPUT
          }

      - name: Create release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: continuous
          name: Continuous build
          body: |
            Compare changes: [${{ steps.previous.outputs.sha }}...${{ github.sha }}](https://github.com/${{ github.repository }}/compare/${{ steps.previous.outputs.sha }}...${{ github.sha }})
          files: |
            ./Dist/*
          overwrite_files: true
          make_latest: true
